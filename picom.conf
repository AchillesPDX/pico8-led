# picom.conf for the pico8-led Xvfb display (:3.0)
#
# This is deliberately minimal - Xvfb is a software framebuffer, not a real
# GPU, so backend must be xrender (glx will not work), and there's no real
# vblank to sync to.
#
# Run manually first to confirm it starts cleanly against your Xvfb:
#   DISPLAY=:3.0 picom --config /home/jared/pico8-led/picom.conf --log-level=DEBUG
#
# Once confirmed, wrap it in its own systemd service (picom.service) ordered
# after the Xvfb service and before now-playing/overlay services.

backend = "xrender";
vsync = false;

# Only composite windows that actually declare an ARGB visual + our
# override-redirect windows - avoid picom trying to shadow/round-corner
# the PICO-8 or feh windows, which don't need it and cost cycles.
mark-wmwin-focused = false;
mark-ovredir-focused = true;

# No shadows, no fading, no rounded corners - this is a 128x128 LED panel,
# not a desktop. Keep it cheap.
shadow = false;
fading = false;
corner-radius = 0;

# Xvfb has no real refresh rate to target
refresh-rate = 0;
